[project]
name = "selfcheck"
version = "0.3.0"
description = "Read-only PR/MR review workbench driven by a local coding agent or an LLM API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "anthropic>=2.0",
]

[project.scripts]
selfcheck = "selfcheck.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["selfcheck"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Explicit, so a newer ruff with wider defaults does not change what passes.
# Line length is a guide here, not a gate (E501 is left out on purpose).
select = ["E4", "E7", "E9", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# FastAPI declares request bodies with a call in the default (Body(...)).
"selfcheck/routes/*" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
